server.servlet.context-path=/ms-beautique
spring.application.name=beautique
server.port=8082

#Configuração do BD

spring.datasource.url=jdbc:postgresql://localhost:3334/beautique
spring.datasource.username=beautique
spring.datasource.password=beautique
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default=beautique_schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=beutique_schema
